<div class="autocomplete-wrapper">
  <div class="input-group">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      class="autocomplete-input"
      [placeholder]="placeholder()"
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (keydown)="onKeydown($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
    />
    @if (isLoading()) {
      <div class="input-spinner"></div>
    }
  </div>

  @if (isOpen()) {
    <ul class="suggestions-list">
      @for (dest of suggestions(); track dest.id; let i = $index) {
        <li
          class="suggestion-item"
          [class.highlighted]="i === highlightedIndex()"
          (mousedown)="selectSuggestion(dest)"
        >
          <span class="suggestion-name">{{ dest.name }}</span>
          <span class="suggestion-location">{{ dest.city }}, {{ dest.country }}</span>
        </li>
      }
    </ul>
  }
</div>
